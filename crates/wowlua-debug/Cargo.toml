[package]
name = "wowlua-debug"
description = "wowlua's debugger and profiler on the emulated client: breakpoints, stepping, inspection, profiles, DAP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The workspace-hack crate (CONTRIBUTING.md): not in WebAssembly builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wowlua-workspace-hack.workspace = true

[features]
default = ["native"]
# Sessions of test files and the addon (through the test runner), and the
# DAP server: not for the browser.
# (and `wowlua mcp`'s standard library reference, decision T551)
native = ["dep:wowlua-test", "dep:wowlua-driver", "dep:wowlua-stdlib", "wowlua-driver/native", "wowlua-test/native"]

[dependencies]
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
wowlua-engine.workspace = true
wowlua-vm.workspace = true
wowlua-driver = { workspace = true, optional = true }
wowlua-test = { workspace = true, optional = true }
wowlua-stdlib = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
wowlua-host.workspace = true

[lints]
workspace = true
