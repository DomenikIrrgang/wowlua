[package]
name = "wowlua-test"
description = "The wowlua test runner: a build's test files run in the engine, each file in a fresh VM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
regex.workspace = true
serde_json.workspace = true
wowlua-api.workspace = true
wowlua-driver.workspace = true
wowlua-host.workspace = true
wowlua-engine.workspace = true
wowlua-flavors.workspace = true
wowlua-span.workspace = true
wowlua-syntax.workspace = true
wowlua-toc.workspace = true
wowlua-vm.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["native"]
# The computer's: fetching Blizzard's UI with git, the C Lua (spec M14,
# decision T396). Without it the runner runs in a page.
native = ["wowlua-driver/native"]

[lints]
workspace = true
