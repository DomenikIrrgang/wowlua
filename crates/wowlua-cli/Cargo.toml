[package]
name = "wowlua-cli"
description = "The wowlua command-line tool: compiler, package manager and tooling for WoW AddOns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "wowlua"
path = "src/main.rs"

[dependencies]
wowlua-diagnostics.workspace = true
wowlua-driver = { workspace = true, features = ["native"] }
wowlua-flavors.workspace = true
wowlua-pkg = { workspace = true, features = ["net"] }
wowlua-manifest.workspace = true
wowlua-runtime.workspace = true
wowlua-test = { workspace = true, features = ["native"] }
wowlua-lsp = { workspace = true, features = ["native"] }
wowlua-debug = { workspace = true, features = ["native"] }
wowlua-vm.workspace = true
wowlua-engine.workspace = true
wowlua-render.workspace = true
wowlua-casc.workspace = true
wowlua-span.workspace = true
serde_json.workspace = true
semver.workspace = true
clap.workspace = true
notify-debouncer-mini.workspace = true
rpassword.workspace = true
termcolor = "1.4"

[dev-dependencies]
wowlua-registry.workspace = true
ureq.workspace = true
zip.workspace = true
mlua.workspace = true
wowlua-vm.workspace = true
wowlua-engine.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tar.workspace = true
flate2.workspace = true
sha2.workspace = true
regex.workspace = true

[lints]
workspace = true
