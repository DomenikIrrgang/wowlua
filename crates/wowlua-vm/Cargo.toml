[package]
name = "wowlua-vm"
description = "A Lua 5.1 virtual machine with WoW's Lua semantics, for wowlua's test runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
autotests = false

[dependencies]
wowlua-span.workspace = true
wowlua-syntax.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true

# The workspace-hack crate (CONTRIBUTING.md): not in WebAssembly builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wowlua-workspace-hack.workspace = true

[dev-dependencies]
mlua.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
