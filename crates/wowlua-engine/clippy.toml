# The engine reads files through `wowlua_host`, so it runs in a page with
# the files in memory (spec M14, decisions T394, T396). What only a
# computer has (the installation's storage) allows these where it is.
disallowed-methods = [
    { path = "std::fs::read", reason = "use wowlua_host" },
    { path = "std::fs::read_to_string", reason = "use wowlua_host" },
    { path = "std::fs::write", reason = "use wowlua_host" },
    { path = "std::fs::create_dir_all", reason = "use wowlua_host" },
    { path = "std::fs::create_dir", reason = "use wowlua_host" },
    { path = "std::fs::remove_file", reason = "use wowlua_host" },
    { path = "std::fs::remove_dir_all", reason = "use wowlua_host" },
    { path = "std::fs::remove_dir", reason = "use wowlua_host" },
    { path = "std::fs::rename", reason = "use wowlua_host" },
    { path = "std::fs::copy", reason = "use wowlua_host" },
    { path = "std::fs::canonicalize", reason = "use wowlua_host" },
    { path = "std::fs::read_dir", reason = "use wowlua_host" },
    { path = "std::fs::metadata", reason = "use wowlua_host" },
    { path = "std::fs::symlink_metadata", reason = "use wowlua_host" },
    { path = "std::fs::File::open", reason = "use wowlua_host" },
    { path = "std::fs::File::create", reason = "use wowlua_host" },
    { path = "std::fs::OpenOptions::open", reason = "use wowlua_host" },
    { path = "std::path::Path::is_file", reason = "use wowlua_host::is_file" },
    { path = "std::path::Path::is_dir", reason = "use wowlua_host::is_dir" },
    { path = "std::path::Path::exists", reason = "use wowlua_host::exists" },
    { path = "std::path::Path::try_exists", reason = "use wowlua_host::exists" },
    { path = "std::path::Path::canonicalize", reason = "use wowlua_host::canonicalize" },
    { path = "std::path::Path::read_dir", reason = "use wowlua_host::read_dir" },
    { path = "std::path::Path::metadata", reason = "use wowlua_host" },
    { path = "walkdir::WalkDir::new", reason = "use wowlua_host::walk" },
    { path = "ignore::WalkBuilder::new", reason = "use wowlua_host::walk" },
    { path = "std::time::SystemTime::now", reason = "use wowlua_host::unix_now: the browser has no clock std can read" },
    { path = "std::time::Instant::now", reason = "the browser has no clock std can read" },
    { path = "std::process::id", reason = "use wowlua_host::process_id: a page has no processes" },
    { path = "std::env::temp_dir", reason = "a page has no temporary directory: check crate::host::installed first" },
]
