[package]
name = "wowlua-engine"
description = "The WoW client's engine for the wowlua VM: the API from Blizzard's documentation, with behaviour where tests need it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
autotests = false

[dependencies]
wowlua-host.workspace = true
flate2.workspace = true
fontdue = "0.9.5"
quick-xml.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
wowlua-api.workspace = true
wowlua-flavors.workspace = true
wowlua-toc.workspace = true
wowlua-vm.workspace = true

# The workspace-hack crate (CONTRIBUTING.md): not in WebAssembly builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wowlua-workspace-hack.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
