[package]
name = "wowlua-lsp"
description = "The wowlua language server (spec §16.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde_json.workspace = true
wowlua-diagnostics.workspace = true
wowlua-driver.workspace = true
wowlua-fmt.workspace = true
wowlua-manifest.workspace = true
wowlua-sema.workspace = true
wowlua-span.workspace = true
wowlua-syntax.workspace = true

[features]
default = ["native"]
# The computer's: downloads, the C Lua (spec M14, decision T394). Without it
# the server runs embedded in a page (`embedded`).
native = ["wowlua-driver/native"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
