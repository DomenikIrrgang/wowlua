# The build path reads and writes through `crate::host`, so it runs on any
# system a host is installed for: the browser's (spec M14, decision T394).
# The server reads files through it too, so it runs embedded in a page (T395).
disallowed-methods = [
    { path = "std::fs::read", reason = "use crate::host" },
    { path = "std::fs::read_to_string", reason = "use crate::host" },
    { path = "std::fs::write", reason = "use crate::host" },
    { path = "std::fs::create_dir_all", reason = "use crate::host" },
    { path = "std::fs::create_dir", reason = "use crate::host" },
    { path = "std::fs::remove_file", reason = "use crate::host" },
    { path = "std::fs::remove_dir_all", reason = "use crate::host" },
    { path = "std::fs::remove_dir", reason = "use crate::host" },
    { path = "std::fs::rename", reason = "use crate::host" },
    { path = "std::fs::copy", reason = "use crate::host" },
    { path = "std::fs::canonicalize", reason = "use crate::host" },
    { path = "std::fs::read_dir", reason = "use crate::host" },
    { path = "std::fs::metadata", reason = "use crate::host" },
    { path = "std::fs::symlink_metadata", reason = "use crate::host" },
    { path = "std::fs::File::open", reason = "use crate::host" },
    { path = "std::fs::File::create", reason = "use crate::host" },
    { path = "std::fs::OpenOptions::open", reason = "use crate::host" },
    { path = "std::path::Path::is_file", reason = "use crate::host::is_file" },
    { path = "std::path::Path::is_dir", reason = "use crate::host::is_dir" },
    { path = "std::path::Path::exists", reason = "use crate::host::exists" },
    { path = "std::path::Path::try_exists", reason = "use crate::host::exists" },
    { path = "std::path::Path::canonicalize", reason = "use crate::host::canonicalize" },
    { path = "std::path::Path::read_dir", reason = "use crate::host::read_dir" },
    { path = "std::path::Path::metadata", reason = "use crate::host" },
    { path = "walkdir::WalkDir::new", reason = "use crate::host::walk" },
    { path = "ignore::WalkBuilder::new", reason = "use crate::host::walk" },
    { path = "std::time::SystemTime::now", reason = "use crate::host::unix_now: the browser has no clock std can read" },
    { path = "std::time::Instant::now", reason = "the browser has no clock std can read" },
    { path = "std::process::id", reason = "use wowlua_driver::host::process_id: a page has no processes" },
    { path = "std::env::temp_dir", reason = "a page has no temporary directory: check crate::host::installed first" },
    { path = "wowlua_manifest::load", reason = "use crate::project::load_manifest" },
    { path = "wowlua_manifest::find_manifest", reason = "use crate::project::find_manifest" },
]
