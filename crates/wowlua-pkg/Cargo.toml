[package]
name = "wowlua-pkg"
description = "The wowlua package manager: sources, cache, resolution and the lockfile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wowlua-diagnostics.workspace = true
wowlua-host.workspace = true
wowlua-manifest.workspace = true
wowlua-span.workspace = true
dirs.workspace = true
flate2.workspace = true
indexmap.workspace = true
pubgrub.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tar.workspace = true
ureq = { workspace = true, optional = true }
walkdir.workspace = true
zip.workspace = true

[features]
default = ["net"]
# Downloads (archives over HTTPS); without it a package is read from the
# cache or the disk only (the browser build).
net = ["dep:ureq"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
