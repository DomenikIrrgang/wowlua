name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request's branch makes its older run moot; runs on
# main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep backtraces and panic locations; full debug info only
  # makes the test binaries larger and slower to link and to start.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Generated files are up to date
        run: cargo xtask check

  # The layers that are to run in the browser (decisions T212, T301, T394):
  # the VM, the engine, the debugger's core, the asset reader, the renderer,
  # the driver that checks, builds and formats a package, the language
  # server and the playground's module (T395).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --target wasm32-unknown-unknown --no-default-features -p wowlua-vm -p wowlua-engine -p wowlua-debug -p wowlua-casc -p wowlua-render -p wowlua-driver -p wowlua-lsp -p wowlua-web

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  # The tests that run Blizzard's UI code (camelot's, from wow-ui-source at
  # the declarations' commit): skipped elsewhere without it.
  blizzard-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: ~/types-src
          key: types-src-camelot-${{ hashFiles('xtask/src/types.rs', 'crates/wowlua-api/data/*.json.gz') }}
      - name: Blizzard's UI code
        run: |
          cargo xtask types fetch ~/types-src
          mkdir -p target
          ln -sfn ~/types-src target/types-src
        env:
          WOWLUA_FETCH_ONLY: camelot
      - run: cargo test -p wowlua-cli --test test_runner --test engine_probe

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace
