name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request's branch makes its older run moot; runs on
# main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Generated files are up to date
        run: cargo xtask check
      # The workspace-hack crate (CONTRIBUTING.md): up to date, and every
      # crate depends on it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - name: The workspace-hack is up to date
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

  # The layers that are to run in the browser (decisions T212, T301, T394):
  # the VM, the engine, the debugger's core, the asset reader, the renderer,
  # the driver that checks, builds and formats a package, the language
  # server, the test runner and the playground's module (T395, T396).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --target wasm32-unknown-unknown --no-default-features -p wowlua-vm -p wowlua-engine -p wowlua-debug -p wowlua-casc -p wowlua-render -p wowlua-host -p wowlua-driver -p wowlua-lsp -p wowlua-test -p wowlua-web
      - run: cargo clippy --target wasm32-unknown-unknown -p wowlua-web --no-deps -- -D warnings
      # The playground's package, built and used as a page uses it (T395).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build && npm test
        working-directory: web

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  # The tests that run Blizzard's UI code (camelot's, from wow-ui-source at
  # the declarations' commit): skipped elsewhere without it.
  blizzard-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: ~/types-src
          key: types-src-camelot-${{ hashFiles('xtask/src/types.rs', 'crates/wowlua-api/data/*.json.gz') }}
      - name: Blizzard's UI code
        run: |
          cargo xtask types fetch ~/types-src
          mkdir -p target
          ln -sfn ~/types-src target/types-src
        env:
          WOWLUA_FETCH_ONLY: camelot
      - run: "cargo test -p wowlua-cli --test suite -- test_runner:: engine_probe::"
      # The playground's game after Blizzard's UI, as the page fetches it (T396).
      - run: cargo test -p wowlua-web --test run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace
