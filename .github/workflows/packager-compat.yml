name: packager-compat

# The M6 exit check: Ace3-based addons adopted with `wowlua init
# --from-pkgmeta` load the same code as the BigWigs packager's build of the
# same commit: Bartender4, and BigWigs (twelve AddOns through move-folders). Needs the network (CurseForge SVN, GitHub), so it
# runs weekly and on demand rather than on every push.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: Bartender4
            repo: https://github.com/Nevcairiel/Bartender4
            rev: 8339c74c5ddb5cd93bf789235774bcce04123155
          - addon: BigWigs
            repo: https://github.com/BigWigsMods/BigWigs
            rev: 1f60846d373b7049c3a2ad1eb7795079e7d747f9
    name: ${{ matrix.addon }}
    runs-on: ubuntu-latest
    env:
      ADDON_REPO: ${{ matrix.repo }}
      ADDON_REV: ${{ matrix.rev }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - run: git --version && (git config --list --show-origin | grep -iv token || true)
      - run: cargo build --release -p wowlua-cli
      - run: scripts/packager-compat.sh
