name: packager-compat

# The M6 exit check: addons built with the BigWigs packager, adopted with
# `wowlua init --from-pkgmeta`, load the same code as the packager's build of
# the same commit. Each addon is pinned to a tested commit. Needs the network (CurseForge SVN, GitHub), so it
# runs weekly and on demand rather than on every push.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: Bartender4
            repo: https://github.com/Nevcairiel/Bartender4
            rev: 8339c74c5ddb5cd93bf789235774bcce04123155
          - addon: BigWigs
            repo: https://github.com/BigWigsMods/BigWigs
            rev: 1f60846d373b7049c3a2ad1eb7795079e7d747f9
          - addon: WeakAuras
            repo: https://github.com/WeakAuras/WeakAuras2
            rev: 502a9c1537d0f7152b3f884808a84d4e68579678
          - addon: DBM
            repo: https://github.com/DeadlyBossMods/DeadlyBossMods
            rev: 31e47d6a23f4ee96a9ad65ff25ad4eb2b7bdf498
          - addon: LittleWigs
            repo: https://github.com/BigWigsMods/LittleWigs
            rev: dd6eafe383a9d2909f27296a4e6c4193d74c16c0
          - addon: Plater
