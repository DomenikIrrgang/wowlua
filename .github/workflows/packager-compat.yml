            rev: f673ca176fe6e98d8f18c1730f03981ca8ca0b02
          - addon: GatherMate2
            repo: https://github.com/Nevcairiel/GatherMate2
            rev: afb09160c706d9c039bfca0c638245ccb6359ac0
          - addon: ShadowedUnitFrames
