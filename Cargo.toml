[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.9.7"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/DomenikIrrgang/wowlua"
authors = ["Domenik Irrgang"]

[workspace.dependencies]
wowlua-span = { path = "crates/wowlua-span" }
wowlua-diagnostics = { path = "crates/wowlua-diagnostics" }
wowlua-flavors = { path = "crates/wowlua-flavors" }
wowlua-manifest = { path = "crates/wowlua-manifest" }
wowlua-toc = { path = "crates/wowlua-toc" }
wowlua-xml = { path = "crates/wowlua-xml" }
wowlua-syntax = { path = "crates/wowlua-syntax" }
wowlua-luair = { path = "crates/wowlua-luair" }
wowlua-lower = { path = "crates/wowlua-lower" }
wowlua-fmt = { path = "crates/wowlua-fmt" }
wowlua-runtime = { path = "crates/wowlua-runtime" }
wowlua-stdlib = { path = "crates/wowlua-stdlib" }
wowlua-types-gen = { path = "crates/wowlua-types-gen" }
wowlua-api = { path = "crates/wowlua-api" }
wowlua-sema = { path = "crates/wowlua-sema" }
wowlua-driver = { path = "crates/wowlua-driver" }
wowlua-pkg = { path = "crates/wowlua-pkg" }
wowlua-vm = { path = "crates/wowlua-vm" }
wowlua-engine = { path = "crates/wowlua-engine" }
wowlua-test = { path = "crates/wowlua-test" }

anyhow = "1.0"
assert_cmd = "2.2"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
codespan-reporting = "0.13"
dirs = "7.0"
flate2 = "1.1"
globset = "0.4"
hashbrown = { version = "0.17", default-features = false }
ignore = "0.4"
indexmap = { version = "2.14", features = ["serde"] }
keyring = "4.2"
insta = "1.49"
junction = "2.1"
mlua = { version = "0.12", features = ["lua51", "vendored"] }
notify-debouncer-mini = "0.7"
predicates = "3.1"
pubgrub = "0.4"
quick-xml = "0.42"
regex = "1.13"
rpassword = "7.5"
rustc-hash = "2.1"
smallvec = "1.16"
schemars = { version = "1.2", features = ["indexmap2"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha1 = "0.10"
sha2 = "0.10"
stacker = "0.1"
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
ureq = "3.4"
walkdir = "2.5"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostics are rich values that only travel on the error path.
result_large_err = "allow"

[profile.release]
# Keep `panic = "unwind"` (the default): parallel regions catch a job's
# panic and run again in order (`wowlua_driver::parallel`).
lto = "thin"
codegen-units = 1
strip = true

# The VM and the engine run Blizzard's UI code in tests: optimized even in
# debug builds, so those tests take seconds, not minutes.
[profile.dev.package.wowlua-vm]
opt-level = 2

[profile.dev.package.wowlua-engine]
opt-level = 2

# What loading Blizzard's UI code spends its time in besides: the parser
# (its Lua), and the engine's API documentation and lookups.
[profile.dev.package.wowlua-syntax]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.indexmap]
opt-level = 2

[profile.dev.package.hashbrown]
opt-level = 2

[profile.dev.package.quick-xml]
opt-level = 2
